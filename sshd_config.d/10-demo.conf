# Demo SSH host settings. Debian's main sshd_config includes this directory
# first, and the first value set for a keyword wins.

HostKey /etc/ssh/host_keys/ssh_host_ed25519_key
HostKey /etc/ssh/host_keys/ssh_host_ecdsa_key
HostKey /etc/ssh/host_keys/ssh_host_rsa_key

PermitRootLogin no
PasswordAuthentication yes
PubkeyAuthentication yes
KbdInteractiveAuthentication no
UsePAM yes

# Connectors open many short sessions; keep them from piling up.
ClientAliveInterval 60
ClientAliveCountMax 3
MaxStartups 30:50:100
